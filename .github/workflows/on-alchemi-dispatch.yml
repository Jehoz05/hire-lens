name: Respond to Alchemi Automation

on:
  repository_dispatch:
    types: [alchemi-automation]

jobs:
  commit-back:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Alchemi Automation"
          git config user.email "automation@alchemi.local"

      - name: Create commit from platform event
        run: |
          echo "## Alchemi Event Received" >> alchemi-last-event.log
          echo "Event type: ${{ github.event.client_payload.event_type || 'alchemi-automation' }}" >> alchemi-last-event.log
          echo "Source: ${{ github.event.client_payload.event_source }}" >> alchemi-last-event.log
          echo "Action: ${{ github.event.client_payload.event_action }}" >> alchemi-last-event.log
          echo "Time: ${{ github.event.client_payload.timestamp }}" >> alchemi-last-event.log
          echo "" >> alchemi-last-event.log
          git add alchemi-last-event.log
          git commit -m "chore: record Alchemi platform event" || echo "No changes to commit"
          git push
